
# ---- Database Configuration ----
# For local dev: Use H2 (uncomment these lines)
# spring.datasource.url=jdbc:h2:file:./newsagency-db;AUTO_SERVER=TRUE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# For production (Render): Use PostgreSQL - set DB_URL environment variable
spring.datasource.url=${DB_URL:jdbc:h2:file:./newsagency-db;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console - DISABLE in production!
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- File uploads ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload-dir=./uploads

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:ThisIsAVerySecretKeyForJWTTokenGenerationNewsAgency2024ChangeMe!}
app.jwt.expiration=86400000

# ---- Admin credentials ----
# Change these in production using environment variables!
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- Server ----
server.port=${SERVER_PORT:8801}

# ---- CORS Origins (comma-separated) ----
# Update this with your production frontend URL!
# Example: app.cors.origins=https://your-app.vercel.app
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3301,http://127.0.0.1:3301}

# ---- Logging (reduce noise) ----
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

