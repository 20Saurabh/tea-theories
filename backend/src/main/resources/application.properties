# ---- Database (H2 file-based for local dev) ----
spring.datasource.url=jdbc:h2:file:./newsagency-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- File uploads ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload-dir=./uploads

# ---- JWT ----
app.jwt.secret=ThisIsAVerySecretKeyForJWTTokenGenerationNewsAgency2024ChangeMe!
app.jwt.expiration=86400000

# ---- Admin credentials — CHANGE THESE ----
app.admin.username=admin
app.admin.password=admin123

# ---- Server ----
server.port=8801

# ---- CORS Origins (comma-separated) ----
# For production, set this to your Vercel domain, e.g.:
# app.cors.origins=http://localhost:3000,http://localhost:3301,https://your-app.vercel.app
app.cors.origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3301,http://127.0.0.1:3301

# ---- Logging (reduce noise) ----
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
