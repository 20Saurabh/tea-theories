
services:
  # Backend API Service
  - type: web
    name: news-agency-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerCommand: java -jar app.jar
    envVars:
      - key: SERVER_PORT
        value: "8801"
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: JWT_SECRET
        value: ThisIsAVerySecretKeyForJWTTokenGeneration2024!
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: APP_CORS_ORIGINS
        # UPDATE THIS: Add your Vercel frontend URL after deployment
        value: "http://localhost:3000,http://localhost:3301"
    autoDeploy: true
    branch: main

  # PostgreSQL Database
  - type: psql
    name: news-agency-db
    databaseName: newsagency
    user: newsagency
    # Password will be generated - copy from Render dashboard
    ipAllowList: [] # Allow only attached services

# IMPORTANT: After deploying:
# 1. Go to news-agency-backend → Environment
# 2. Add DB_URL from the PostgreSQL service (it will be auto-linked)
# 3. Update APP_CORS_ORIGINS with your Vercel frontend URL (e.g., https://your-app.vercel.app)

